<title>Naturheilkunde Lerntrainer</title>
<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#3b7a57">
<style>
  :root{--bg:#f4f6f3;--card:#fff;--ink:#1c211d;--muted:#6b736c;--line:#e2e7e0;--accent:#3b7a57}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .karte{background:var(--card);border:1px solid var(--line);border-radius:16px;
         padding:28px 24px;max-width:380px;width:100%;
         box-shadow:0 1px 3px rgba(0,0,0,.04)}
  h1{font-size:19px;margin:0 0 6px}
  p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 18px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line);
        border-radius:10px;background:#fff;color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  button{width:100%;margin-top:14px;padding:13px 16px;font-size:15px;font-weight:600;
         border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .fehler{color:#a2382f;font-size:13px;margin-top:12px;min-height:18px}
  .fuss{margin-top:20px;font-size:12px;color:var(--muted);line-height:1.5}
</style>
</head>

<script>
(function(){
  var tresor = JSON.parse(document.getElementById('tresor').textContent);
  var SPEICHER = 'nhk-zugang';

  function ausB64(s){
    var roh = atob(s), feld = new Uint8Array(roh.length);
    for (var i = 0; i < roh.length; i++) feld[i] = roh.charCodeAt(i);
    return feld;
  }

  async function oeffnen(wort){
    var enc = new TextEncoder();
    var basis = await crypto.subtle.importKey('raw', enc.encode(wort),
                  'PBKDF2', false, ['deriveKey']);
    var schluessel = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:ausB64(tresor.salz), iterations:tresor.runden, hash:'SHA-256'},
      basis, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var klar = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:ausB64(tresor.nonce)}, schluessel, ausB64(tresor.daten));
    return new TextDecoder().decode(klar);
  }

  function starten(html){
    document.open();
    document.write(html);
    document.close();
  }

  async function versuchen(wort, still){
    try {
      var html = await oeffnen(wort);
      try { localStorage.setItem(SPEICHER, wort); } catch (e) {}
      starten(html);
      return true;
    } catch (e) {
      if (!still) {
        document.getElementById('fehler').textContent =
          'Das Zugangswort stimmt nicht. Bitte noch einmal versuchen.';
        document.getElementById('knopf').disabled = false;
        document.getElementById('knopf').textContent = 'Lernwelt öffnen';
      }
      return false;
    }
  }

  document.getElementById('form').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('fehler').textContent = '';
    var knopf = document.getElementById('knopf');
    knopf.disabled = true;
    knopf.textContent = 'Einen Moment ...';
    versuchen(document.getElementById('wort').value, false);
  });

  // Schon einmal geöffnet? Dann direkt starten.
  var gemerkt = null;
  try { gemerkt = localStorage.getItem(SPEICHER); } catch (e) {}
  if (gemerkt) versuchen(gemerkt, true);
})();
</script>
